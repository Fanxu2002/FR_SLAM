fr_slam:
  ros__parameters:

    # ============================================================
    # LO
    # ============================================================
    backend_loop_closure_enable: false
    planar_motion_mode: false

    # ============================================================
    # Ground
    # Ground enable/mode are selected by slam.launch.py.
    # ============================================================
    # Final Ground V1：Ground-only tilt/Z correction
    # S² normal + tangent heading + piecewise-frozen reference
    # ============================================================
    ground_analysis_voxel_leaf_size: 0.15

    # 只有连续获得若干相互一致且高质量的支撑平面观测后，才冻结参考平面。 / The reference is frozen only after several mutually consistent,
    # 这些观测需要具有较高质量。 / high-quality support-plane observations.
    ground_anchor_bootstrap_frames: 8
    ground_anchor_max_normal_spread_deg: 2.0
    ground_anchor_max_plane_d_spread_m: 0.08

    # Ground measurement quality / gross sanity.
    # Residuals never trigger reference switching by themselves.
    ground_plane_information_scale: 1.0
    ground_max_height_residual_m: 5.00
    ground_max_normal_residual_deg: 10.0

    # Ground-only trust region.
    ground_max_tilt_correction_deg: 0.25
    ground_max_z_correction_m: 0.030

    # Candidate construction guards.
    ground_min_reference_normal_z: 0.50
    ground_min_heading_projection_norm: 0.0001
    ground_sanity_height_tolerance_m: 0.005
    ground_sanity_normal_tolerance_deg: 0.000001

    # LiDAR-frame forward axis used for tangent-heading reconstruction.
    ground_forward_axis_x: 1.0
    ground_forward_axis_y: 0.0
    ground_forward_axis_z: 0.0

    # Largest safe candidate is tried first.
    ground_line_search_alpha_1: 1.0
    ground_line_search_alpha_2: 0.5
    ground_line_search_alpha_3: 0.25

    # Piecewise-frozen lifecycle.  A future pose-invariant TerrainChangeDetector
    # may request PENDING_SWITCH; residual alone never switches the reference.
    ground_reference_switch_confirmation_frames: 8

    # General geometry is a safety evaluator only, never a Ground optimizer.
    ground_max_general_rmse_ratio: 1.03
    ground_max_general_rmse_absolute_increase_m: 0.003
    ground_min_general_correspondence_ratio: 0.85

    # 可信支撑面门限与逐帧审计 CSV。 / Trusted-support gate and per-frame audit CSV.
    ground_support_constraint_minimum_points: 120
    ground_support_constraint_minimum_cells: 30
    ground_support_constraint_minimum_center_cells: 3
    ground_support_constraint_minimum_inlier_ratio: 0.90
    ground_support_constraint_maximum_rmse_m: 0.030
    ground_support_constraint_minimum_score: 8.5
    ground_support_constraint_enter_confidence: 0.62
    ground_support_constraint_keep_confidence: 0.62
    ground_clearance_bootstrap_samples: 8
    ground_diagnostics_enable: true

    # ============================================================
